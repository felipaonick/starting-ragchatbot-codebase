[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.0.15",
    "anthropic==0.58.2",
    "sentence-transformers==5.0.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.4.1",
    "flake8-pyproject>=1.2.4",
    "httpx>=0.28.1",
    "isort>=9.0.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
    "live: calls the real Anthropic API (needs ANTHROPIC_API_KEY; run with -m live)",
    "api: FastAPI endpoint tests (run alone with -m api)",
]
addopts = "-m 'not live' -ra --strict-markers"

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = '''
/(
    chroma_db
)/
'''

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["backend", "main.py"]
skip_gitignore = true

[tool.flake8]
max-line-length = 88
# E203/W503/E701/E704 conflict with black; E501 is left to black (it won't split long strings)
extend-ignore = ["E203", "W503", "E701", "E704", "E501"]
exclude = [".git", ".venv", "__pycache__", "chroma_db", ".trees"]
